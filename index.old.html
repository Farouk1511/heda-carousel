const WEEKS = [
  {num:1,title:"The Motivation Lie"},{num:2,title:"The Social Animal"},{num:3,title:"The Identity Shift"},
  {num:4,title:"The Tribe Exists"},{num:5,title:"Competition is the Cheat Code"},{num:6,title:"The Future of Gym Social"},
  {num:7,title:"The Grind is Social"},{num:8,title:"Built Different"},{num:9,title:"The Movement"}
];

// ─── STATE ──────────────────────────────────────────────────────────────────
let state = {
  selectedPost: 0,
  currentSlide: 0,
  theme: "standard",
  editingSlide: null,
  sidebarCollapsed: false,
  exportRatio: "4:5",
  posts: JSON.parse(JSON.stringify(POSTS))
};


const LOGO_SRC = './LOGO.png';
function getPost() { return state.posts[state.selectedPost]; }
function getSlides() { return getPost().slides; }
function getSlide() { return getSlides()[state.currentSlide]; }

// ─── RENDER HELPERS ─────────────────────────────────────────────────────────
function renderHL(text, isCTA) {
  return text.replace(/\*\*([^*]+)\*\*/g, (_, m) =>
    isCTA ? m : `<span class="hl">${m}</span>`
  );
}

function renderCard() {
  const slide = getSlide();
  const idx = state.currentSlide;
  const total = getSlides().length;
  const isCTA = !!slide.cta;
  const th = state.theme;

  let cls = "card ";
  if (isCTA) cls += th === "deep" ? "card--cta-deep" : "card--cta-standard";
  else cls += th === "deep" ? "card--deep" : "card--standard";

  let dotsHTML = "";
  for (let i = 0; i < total; i++) {
    dotsHTML += `<div class="card-dot ${i === idx ? "card-dot--active" : "card-dot--inactive"}"></div>`;
  }

  let footerHTML = "";
  if (idx === 0) footerHTML += `<div class="card-handle">@joinheda</div>`;
  if (isCTA && slide.cta) footerHTML += `<div class="card-cta-text">${slide.cta}</div>`;
  if (!isCTA && idx < total - 1) footerHTML += `<div class="card-swipe">SWIPE →</div>`;

  return `
    <div class="${cls}">
      <img class="card-logo" src="${LOGO_SRC}" alt="Heda">
      ${!isCTA ? '<div class="card-orb"></div>' : ''}
      <div>
        <div class="card-header-row">
          <span>${String(idx+1).padStart(2,"0")} / ${String(total).padStart(2,"0")}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-headline">${renderHL(slide.headline, isCTA)}</div>
        <div class="card-sub">${slide.sub}</div>
      </div>
      <div class="card-footer">${footerHTML}</div>
      <div class="card-dots">${dotsHTML}</div>
    </div>
  `;
}

// ─── FULL RENDER ────────────────────────────────────────────────────────────
function render() {
  const post = getPost();
  const slides = getSlides();
  const s = state;

  // Sidebar left
  let sidebarHTML = "";
  WEEKS.forEach(w => {
    const wp = state.posts.filter(p => p.week === w.num);
    if (!wp.length) return;
    sidebarHTML += `<div class="week-group">
      <div class="week-label">Week ${w.num} — ${w.title}</div>`;
    wp.forEach(p => {
      const gi = state.posts.indexOf(p);
      sidebarHTML += `
        <div class="post-item ${gi === s.selectedPost ? 'active' : ''}" onclick="selectPost(${gi})">
          <div class="day">Day ${p.day}</div>
          <div class="title">${p.title}</div>
        </div>`;
    });
    sidebarHTML += `</div>`;
  });

  // Tags
  let tagsHTML = post.tags.map(t => `<span class="tag">${t}</span>`).join("");

  // Slide editors
  let editorsHTML = "";
  slides.forEach((sl, i) => {
    const isEd = s.editingSlide === i;
    editorsHTML += `
      <div class="slide-edit-item">
        <div class="slide-edit-header ${isEd ? 'active' : ''}" onclick="toggleEdit(${i})">
          <div class="slide-edit-label">
            <span class="slide-edit-num">Slide ${i+1}</span>
            <span class="slide-edit-type">${sl.type}</span>
          </div>
          <span class="slide-edit-arrow">▾</span>
        </div>
        <div class="slide-edit-body ${isEd ? 'open' : ''}">
          <div class="edit-field">
            <label class="edit-label">HEADLINE</label>
            <textarea class="edit-textarea" rows="2" oninput="updateField(${i},'headline',this.value)">${sl.headline}</textarea>
          </div>
          <div class="edit-field">
            <label class="edit-label">SUBTEXT</label>
            <textarea class="edit-textarea" rows="2" oninput="updateField(${i},'sub',this.value)">${sl.sub}</textarea>
          </div>
        </div>
      </div>`;
  });

  // Preview dots
  let previewDotsHTML = "";
  for (let i = 0; i < slides.length; i++) {
    previewDotsHTML += `<button class="preview-dot ${i === s.currentSlide ? 'preview-dot--active' : 'preview-dot--inactive'}" onclick="goSlide(${i})"></button>`;
  }

  // Caption
  const cleanHL = post.slides[0].headline.replace(/\*\*/g, "");
  const captionHTML = `${cleanHL} 💪<br><br>${post.slides[0].sub}<br><br>Swipe through for the full truth. ➡️<br><br>#gymculture #heda #fitnesscommunity #gymmotivation #accountability #gympartner #liftingcrew #consistency`;

  document.getElementById("app").innerHTML = `
    <!-- LEFT SIDEBAR -->
    <div class="sidebar-left ${s.sidebarCollapsed ? 'collapsed' : ''}">
      <div class="sidebar-inner">
        <div class="logo">HEDA</div>
        <div class="logo-sub">Carousel Generator</div>
        <div class="post-count">${state.posts.length} POSTS</div>
        ${sidebarHTML}
      </div>
    </div>

    <!-- CENTER -->
    <div class="center">
      <div class="topbar">
        <div class="topbar-left">
          <button class="btn-toggle" onclick="toggleSidebar()">${s.sidebarCollapsed ? '☰' : '✕'}</button>
          <div class="post-title-bar">Post ${s.selectedPost+1} — "${post.title}"</div>
        </div>
        <div class="tags">${tagsHTML}</div>
      </div>

      <div class="slide-nav">
        <button class="nav-btn" onclick="prevSlide()" ${s.currentSlide === 0 ? 'disabled' : ''}>‹</button>
        <span class="slide-counter">${s.currentSlide+1} / ${slides.length}</span>
        <button class="nav-btn" onclick="nextSlide()" ${s.currentSlide === slides.length-1 ? 'disabled' : ''}>›</button>
      </div>

      <div class="card-area">
        <div style="width:100%;max-width:400px">
          ${renderCard()}
        </div>
      </div>

      <div class="preview-dots">${previewDotsHTML}</div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="sidebar-right">
      <div class="section-label">THEME</div>
      <div class="theme-btns">
        <button class="theme-btn ${s.theme==='standard'?'active':''}" onclick="setTheme('standard')">Standard</button>
        <button class="theme-btn ${s.theme==='deep'?'active':''}" onclick="setTheme('deep')">Deep</button>
      </div>

      <div class="section-label">EDIT SLIDES</div>
      ${editorsHTML}

      <div class="section-label" style="margin-top:28px">EXPORT</div>
      <div class="section-label" style="margin-top:0; margin-bottom:6px; font-size:10px; opacity:0.5;">ASPECT RATIO</div>
      <div class="ratio-btns">
        <button class="ratio-btn ${s.exportRatio==='1:1'?'active':''}" onclick="setExportRatio('1:1')">1:1</button>
        <button class="ratio-btn ${s.exportRatio==='4:5'?'active':''}" onclick="setExportRatio('4:5')">4:5</button>
        <button class="ratio-btn ${s.exportRatio==='9:16'?'active':''}" onclick="setExportRatio('9:16')">9:16</button>
      </div>
      <button class="export-btn-primary" onclick="exportAllSlides()">↓ ZIP — All Slides + Caption</button>
      <button class="export-btn-secondary" onclick="exportCurrentSlide()">↓ PNG — This Slide Only</button>
      <div class="export-progress" id="exportProgress"></div>

      <div class="section-label" style="margin-top:28px">CAPTION PREVIEW</div>
      <div class="caption-preview">${captionHTML}</div>
    </div>
  `;
}

// ─── ACTIONS ────────────────────────────────────────────────────────────────
function selectPost(i) { state.selectedPost = i; state.currentSlide = 0; state.editingSlide = null; render(); }
function goSlide(i) { state.currentSlide = i; render(); }
function prevSlide() { if (state.currentSlide > 0) { state.currentSlide--; render(); } }
function nextSlide() { if (state.currentSlide < getSlides().length - 1) { state.currentSlide++; render(); } }
function setTheme(t) { state.theme = t; render(); }
function toggleSidebar() { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
function setExportRatio(r) { state.exportRatio = r; render(); }
function toggleEdit(i) {
  state.editingSlide = state.editingSlide === i ? null : i;
  state.currentSlide = i;
  render();
}
function updateField(slideIdx, field, value) {
  state.posts[state.selectedPost].slides[slideIdx][field] = value;
  // Re-render card only (avoid losing textarea focus)
  const cardArea = document.querySelector('.card-area > div');
  if (cardArea) cardArea.innerHTML = renderCard();
  // Update caption if slide 0
  if (slideIdx === 0) {
    const cp = document.querySelector('.caption-preview');
    if (cp) {
      const post = getPost();
      const cleanHL = post.slides[0].headline.replace(/\*\*/g, "");
      cp.innerHTML = `${cleanHL} 💪<br><br>${post.slides[0].sub}<br><br>Swipe through for the full truth. ➡️<br><br>#gymculture #heda #fitnesscommunity #gymmotivation #accountability #gympartner #liftingcrew #consistency`;
    }
  }
}

// ─── EXPORT ─────────────────────────────────────────────────────────────────
function setProgress(msg) {
  const el = document.getElementById('exportProgress');
  if (el) el.textContent = msg;
}

function getExportDimensions() {
  switch (state.exportRatio) {
    case "1:1":  return { w: 1080, h: 1080 };
    case "9:16": return { w: 1080, h: 1920 };
    case "4:5":
    default:     return { w: 1080, h: 1350 };
  }
}

async function captureCard() {
  const { w, h } = getExportDimensions();

  // Create an offscreen container at full export size
  const offscreen = document.createElement('div');
  offscreen.style.cssText = `
    position: fixed; left: -9999px; top: 0; z-index: -1;
    width: ${w}px; height: ${h}px; overflow: hidden;
  `;
  // Inject a full-size card inside it
  offscreen.innerHTML = `
    <div style="width:${w}px; height:${h}px; display:flex; align-items:center; justify-content:center;">
      <div style="width:${w}px;">
        ${renderCard().replace(
          'class="card ',
          'style="width:'+w+'px; height:'+h+'px; max-width:none; aspect-ratio:auto; border-radius:0; padding:' + Math.round(w*0.06) + 'px ' + Math.round(w*0.05) + 'px;" class="card '
        )}
      </div>
    </div>
  `;
  document.body.appendChild(offscreen);

  // Scale up font sizes for the offscreen card
  const card = offscreen.querySelector('.card');
  const scaleFactor = w / 400; // card is normally 400px wide
  card.querySelectorAll('.card-type').forEach(el => el.style.fontSize = (11 * scaleFactor) + 'px');
  card.querySelectorAll('.card-type').forEach(el => el.style.marginBottom = (24 * scaleFactor) + 'px');
  card.querySelectorAll('.card-headline').forEach(el => {
    const isCTA = card.classList.contains('card--cta-standard') || card.classList.contains('card--cta-deep');
    el.style.fontSize = ((isCTA ? 32 : 28) * scaleFactor) + 'px';
    el.style.marginBottom = (16 * scaleFactor) + 'px';
  });
  card.querySelectorAll('.card-sub').forEach(el => el.style.fontSize = (14 * scaleFactor) + 'px');
  card.querySelectorAll('.card-header-row').forEach(el => {
    el.style.fontSize = (11 * scaleFactor) + 'px';
    el.style.marginBottom = (8 * scaleFactor) + 'px';
  });
  card.querySelectorAll('.card-handle').forEach(el => el.style.fontSize = (12 * scaleFactor) + 'px');
  card.querySelectorAll('.card-swipe').forEach(el => el.style.fontSize = (11 * scaleFactor) + 'px');
  card.querySelectorAll('.card-cta-text').forEach(el => el.style.fontSize = (14 * scaleFactor) + 'px');
  card.querySelectorAll('.card-dots').forEach(el => {
    el.style.bottom = (16 * scaleFactor) + 'px';
    el.style.left = (28 * scaleFactor) + 'px';
    el.style.gap = (6 * scaleFactor) + 'px';
  });
  card.querySelectorAll('.card-dot').forEach(el => {
    el.style.height = (6 * scaleFactor) + 'px';
    el.style.borderRadius = (3 * scaleFactor) + 'px';
  });
  card.querySelectorAll('.card-dot--inactive').forEach(el => el.style.width = (6 * scaleFactor) + 'px');
  card.querySelectorAll('.card-dot--active').forEach(el => el.style.width = (18 * scaleFactor) + 'px');
  card.querySelectorAll('.card-logo').forEach(el => {
    el.style.width = (32 * scaleFactor) + 'px';
    el.style.height = (32 * scaleFactor) + 'px';
    el.style.top = (16 * scaleFactor) + 'px';
    el.style.right = (16 * scaleFactor) + 'px';
  });
  card.querySelectorAll('.card-orb').forEach(el => {
    el.style.width = (120 * scaleFactor) + 'px';
    el.style.height = (120 * scaleFactor) + 'px';
    el.style.top = (-40 * scaleFactor) + 'px';
    el.style.right = (-40 * scaleFactor) + 'px';
  });

  // Wait for fonts/images to load
  await new Promise(r => setTimeout(r, 200));

  const canvas = await html2canvas(card, {
    width: w,
    height: h,
    scale: 1,
    useCORS: true,
    backgroundColor: null
  });

  document.body.removeChild(offscreen);
  return canvas;
}

function canvasToBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function exportCurrentSlide() {
  const post = getPost();
  setProgress('Rendering…');
  try {
    const canvas = await captureCard();
    const blob = await canvasToBlob(canvas);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `heda_day${post.day}_slide${state.currentSlide + 1}.png`;
    a.click();
    URL.revokeObjectURL(url);
    setProgress('Downloaded ✓');
  } catch (e) {
    setProgress('Error: ' + e.message);
  }
  setTimeout(() => setProgress(''), 2500);
}

async function exportAllSlides() {
  const post = getPost();
  const slides = getSlides();
  const originalSlide = state.currentSlide;
  const zip = new JSZip();
  const folder = zip.folder(`heda_day${post.day}`);

  try {
    for (let i = 0; i < slides.length; i++) {
      setProgress(`Rendering slide ${i + 1} / ${slides.length}…`);
      state.currentSlide = i;
      // Re-render just the card
      const cardContainer = document.querySelector('.card-area > div');
      if (cardContainer) cardContainer.innerHTML = renderCard();
      // Small delay to let the DOM update
      await new Promise(r => setTimeout(r, 100));
      const canvas = await captureCard();
      const blob = await canvasToBlob(canvas);
      const typeName = slides[i].type.toLowerCase().replace(/\s+/g, '_');
      folder.file(`slide_${i + 1}_${typeName}.png`, blob);
    }

    // Add caption
    const cleanHL = post.slides[0].headline.replace(/\*\*/g, "");
    const caption = `${cleanHL}\n\n${post.slides[0].sub}\n\nSwipe through for the full truth. ➡️\n\n#gymculture #heda #fitnesscommunity #gymmotivation #accountability #gympartner #liftingcrew #consistency`;
    folder.file('caption.txt', caption);

    setProgress('Zipping…');
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `heda_day${post.day}_carousel.zip`;
    a.click();
    URL.revokeObjectURL(url);
    setProgress(`${slides.length} slides + caption downloaded ✓`);
  } catch (e) {
    setProgress('Error: ' + e.message);
  }

  // Restore original slide
  state.currentSlide = originalSlide;
  render();
  setTimeout(() => setProgress(''), 3000);
}

// ─── INIT ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
